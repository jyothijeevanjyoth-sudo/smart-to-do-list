<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart To-Do List</h1>
        <p>Manage your tasks easily</p>
    </header>

    <main>

        <section class="add-section">

            <h2>Add Task</h2>

            <form id="todoForm">

                <div class="form-group task-group">
                    <label for="todoInput">Task</label>
                    <input
                        id="todoInput"
                        type="text"
                        placeholder="Enter your task"
                    >
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input
                        id="dueDate"
                        type="date"
                    >
                </div>

                <button type="submit" class="add-button">
                    Add Task
                </button>

            </form>

        </section>


        <section class="tasks-section">

            <h2>Tasks</h2>

            <div class="task-controls">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >

                <div class="filter-buttons">
                    <button type="button" id="allBtn">All</button>
                    <button type="button" id="activeBtn">Active</button>
                    <button type="button" id="completedBtn">Completed</button>
                </div>

            </div>


            <div class="task-counts">

                <div class="count-box">
                    <span>Total</span>
                    <strong id="totalCount">0</strong>
                </div>

                <div class="count-box">
                    <span>Active</span>
                    <strong id="activeCount">0</strong>
                </div>

                <div class="count-box">
                    <span>Completed</span>
                    <strong id="completedCount">0</strong>
                </div>

            </div>


            <ul id="taskList"></ul>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
